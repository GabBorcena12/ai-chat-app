services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aichatapp-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dummy_Local_Sql123!}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - aichatapp-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: AIChatApp.API/Dockerfile
    container_name: aichatapp-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      AppSettings__BaseUrl: http://aichatapp-api:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=AIChatAppDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Dummy_Local_Sql123!};TrustServerCertificate=True;
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:-dummy-local-jwt-secret-key-32-characters-minimum}
      ApiKey.Settings__ClientName: ${API_CLIENT_NAME:-GajiTechClient}
      ApiKey.Settings__Keys__0: ${API_KEY:-dummy-local-api-key}
      EmailSettings__From: ${SMTP_FROM:-dummy@example.invalid}
      EmailSettings__SmtpServer: ${SMTP_SERVER:-localhost}
      EmailSettings__Port: ${SMTP_PORT:-587}
      EmailSettings__Username: ${SMTP_USERNAME:-dummy-local-user}
      EmailSettings__AppPassword: ${SMTP_APP_PASSWORD:-dummy-local-app-password}
      Backoffice__SeedDefaultAdmin: "false"
      Backoffice__SeedDefaultRoleAccounts: ${SEED_DEFAULT_ROLE_ACCOUNTS:-true}
      Backoffice__DefaultAdminUsername: ${BACKOFFICE_ADMIN_USERNAME:-localadmin}
      Backoffice__DefaultAdminEmail: ${BACKOFFICE_ADMIN_EMAIL:-localadmin@example.invalid}
      Backoffice__DefaultAdminPassword: ${BACKOFFICE_ADMIN_PASSWORD:-Dummy_Local_Admin123!}
      Backoffice__DefaultUserUsername: ${BACKOFFICE_USER_USERNAME:-localuser}
      Backoffice__DefaultUserEmail: ${BACKOFFICE_USER_EMAIL:-localuser@example.invalid}
      Backoffice__DefaultUserPassword: ${BACKOFFICE_USER_PASSWORD:-Dummy_Local_User123!}
      Backoffice__DefaultValidatorUsername: ${BACKOFFICE_VALIDATOR_USERNAME:-localvalidator}
      Backoffice__DefaultValidatorEmail: ${BACKOFFICE_VALIDATOR_EMAIL:-localvalidator@example.invalid}
      Backoffice__DefaultValidatorPassword: ${BACKOFFICE_VALIDATOR_PASSWORD:-Dummy_Local_Validator123!}
      ResponseReviewer__PublishedModelPath: AIChatApp.MLTraining/ReviewerModels/published-response-reviewer.zip
      ResponseReviewer__CandidateModelFolder: AIChatApp.MLTraining/ReviewerModels/Candidates
      LocalModel__FileName: ${LOCAL_MODEL_FILE:-qwen2.5-3b-instruct-q4_k_m.gguf}
    ports:
      - "127.0.0.1:5157:8080"
    volumes:
      - ./AIChatApp.Core/Models:/app/AIChatApp.Core/Models:ro
      - ./AIChatApp.MLTraining/ReviewerModels:/app/AIChatApp.MLTraining/ReviewerModels

  gateway:
    build:
      context: .
      dockerfile: AIChatApp.Gateway/Dockerfile
    container_name: aichatapp-gateway
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ApiKey.Settings__ClientName: ${API_CLIENT_NAME:-GajiTechClient}
      ApiKey.Settings__Keys__0: ${API_KEY:-dummy-local-api-key}
      ReverseProxy__Clusters__ChatCluster__Destinations__chatApi__Address: http://aichatapp-api:8080/
      ReverseProxy__Clusters__AuthCluster__Destinations__authApi__Address: http://aichatapp-api:8080/
      ReverseProxy__Clusters__ChatHistoryCluster__Destinations__chatHistoryApi__Address: http://aichatapp-api:8080/
      ReverseProxy__Clusters__BackofficeCluster__Destinations__backofficeApi__Address: http://aichatapp-api:8080/
    ports:
      - "127.0.0.1:5001:8080"

  web:
    build:
      context: .
      dockerfile: AIChatApp.Web/Dockerfile
    container_name: aichatapp-web
    depends_on:
      - gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Frontend__GatewayBaseUrl: http://aichatapp-gateway:8080/
      Frontend__ApiClientName: ${API_CLIENT_NAME:-GajiTechClient}
      Frontend__ApiKey: ${API_KEY:-dummy-local-api-key}
      ResponseReviewer__PublishedModelPath: AIChatApp.MLTraining/ReviewerModels/published-response-reviewer.zip
      ResponseReviewer__CandidateModelFolder: AIChatApp.MLTraining/ReviewerModels/Candidates
    ports:
      - "127.0.0.1:44318:8080"
    volumes:
      - ./AIChatApp.MLTraining/ReviewerModels:/app/AIChatApp.MLTraining/ReviewerModels

volumes:
  aichatapp-sql-data:
